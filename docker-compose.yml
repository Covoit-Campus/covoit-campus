services:
  app:
    build: ./docker/php
    container_name: covoit-app
    ports:
      - "8000:80"            # API + module analytique : http://localhost:8000
    volumes:
      - ./backend:/var/www/html
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.4
    container_name: covoit-db
    environment:
      MYSQL_DATABASE: covoit
      MYSQL_USER: covoit
      MYSQL_PASSWORD: covoit
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"          # 3307 pour ne pas gêner un MySQL/XAMPP déjà installé
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      retries: 20

  phpmyadmin:
    image: phpmyadmin
    container_name: covoit-pma
    ports:
      - "8080:80"            # http://localhost:8080
    environment:
      PMA_HOST: db
    depends_on:
      - db

  mailpit:
    image: axllent/mailpit
    container_name: covoit-mail
    ports:
      - "8025:8025"          # boîte mail de test : http://localhost:8025

volumes:
  db-data: